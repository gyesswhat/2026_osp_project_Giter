{% extends "index.html" %}
{% block title %}{{ name }} - EwhaMarket{% endblock %}
{% block content %}
<h1>상품 상세</h1>
<table class="result">
  <tr><th>Product name</th><td>{{ name }}</td></tr>
  <tr><th>Seller ID</th><td>{{ data.seller }}</td></tr>
  <tr><th>Price</th><td>{{ data.price }}원</td></tr>
  <tr><th>Address</th><td>{{ data.address }}</td></tr>
  <tr><th>status</th><td>{{ data.status }}</td></tr>
  <tr><th>Email</th><td>{{ data.email }}</td></tr>
  <tr><th>Picture</th><td>
    <img src="{{ url_for('static', filename='uploads/' ~ data.img_path if data.img_path else 'sample/sample_product.png') }}" alt="{{ name }}" class="preview" onerror="this.onerror=null;this.src='{{ url_for('static', filename='sample/sample_product.png') }}'">
  </td></tr>
</table>
<a href="{{ url_for('item_list') }}">← 목록으로</a>
{% endblock %}
