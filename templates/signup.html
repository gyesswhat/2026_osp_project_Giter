{% extends "index.html" %}
{% block title %}Signup - EwhaMarket{% endblock %}
{% block content %}
<h1>회원가입</h1>
<form action="{{ url_for('register_user') }}" method="post">
  <label>ID : <input type="text" name="id" required></label>
  <label>Password : <input type="password" name="pw" required></label>
  <label>Nickname : <input type="text" name="nickname" required></label>
  <p>Input ID and password, and click the create button</p>
  <input type="submit" value="Create">
</form>
{% endblock %}
